name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @syt/api

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -w @syt/api

      - name: Build API
        run: npm run build -w @syt/api

      - name: Build web
        run: npm run build -w @syt/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
